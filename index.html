<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mascot Animations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7FDFE; --card: #ffffff; --line: #e3eef2; --ink: #1f1a3d; --muted: #6b6886;
    --brand: #6C47FF; --chip: #efeaff; --stage: #F7FDFE;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Baloo 2", "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { max-width: 1200px; margin: 0 auto; padding: 40px 16px 8px; text-align: center; }
  h1 { font-size: clamp(32px, 6vw, 56px); margin: 0; line-height: 1.1; }
  h1 span { background: var(--ink); color: #fff3e3; padding: 0 12px; border-radius: 6px; }
  header p { color: var(--muted); font-size: 18px; margin: 12px auto 0; max-width: 640px; }
  .bar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
         backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .bar-in { max-width: 1200px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip { border: 0; background: var(--chip); color: var(--brand); font: inherit; font-weight: 700; font-size: 15px;
          padding: 6px 14px; border-radius: 999px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--brand); color: #fff; }
  .sep { flex: 1; }
  .bg-label { color: var(--muted); font-size: 14px; }
  .sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; }
  .sw[aria-pressed="true"] { outline: 3px solid var(--brand); outline-offset: 1px; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px 16px 60px; }
  section h2 { display: flex; align-items: center; gap: 12px; font-size: 28px; margin: 32px 0 12px; }
  section h2 img { width: 52px; height: 52px; object-fit: contain; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
  .stage { background: var(--stage); aspect-ratio: 1 / 1; display: grid; place-items: center; padding: 12px; cursor: zoom-in; transition: background .2s; }
  .stage img { max-width: 100%; max-height: 100%; }
  .meta { padding: 10px 14px 12px; display: flex; align-items: center; gap: 8px; }
  .meta b { font-size: 17px; }
  .tag { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: #e8f8f2; color: #1b7f5e; }
  .tag.trend { background: #ffe9f3; color: #c2337a; }
  .tag.sport { background: #fff3dc; color: #a86400; }
  .meta a { margin-left: auto; color: var(--brand); font-weight: 700; text-decoration: none; font-size: 14px; }
  dialog { border: 0; border-radius: 20px; padding: 0; max-width: min(92vw, 900px); background: var(--stage); }
  dialog::backdrop { background: rgba(20, 16, 40, .6); }
  dialog img { display: block; max-width: 100%; max-height: 80vh; margin: 0 auto; padding: 24px; }
  dialog .cap { display: flex; gap: 8px; align-items: center; padding: 0 20px 16px; font-weight: 700; }
  dialog .cap button { margin-left: auto; }
  footer { text-align: center; color: var(--muted); font-size: 14px; padding: 0 16px 32px; }
  .hide { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Mascot <span>Animations</span></h1>
  <p>Bộ GIF động cho 3 nhân vật của Robotic Simulation · lấy cảm hứng từ Clippy, trend gen alpha và thể thao ngoài trời.</p>
</header>

<div class="bar"><div class="bar-in" id="filters">
  <button class="chip" data-f="all" aria-pressed="true">Tất cả</button>
  <button class="chip" data-f="clippy">Clippy</button>
  <button class="chip" data-f="trend">Gen Alpha</button>
  <button class="chip" data-f="sport">Thể thao</button>
  <span class="sep"></span>
  <span class="bg-label">Nền thử:</span>
  <button class="sw" data-bg="#F7FDFE" style="background:#F7FDFE" aria-pressed="true" title="Nền trang web"></button>
  <button class="sw" data-bg="#ffffff" style="background:#fff" title="Trắng"></button>
  <button class="sw" data-bg="#ffe8c7" style="background:#ffe8c7" title="Kem"></button>
  <button class="sw" data-bg="#1f1a3d" style="background:#1f1a3d" title="Tối"></button>
</div></div>

<main id="main"></main>

<dialog id="dlg"><img id="dlg-img" alt=""><div class="cap"><span id="dlg-cap"></span><button class="chip" id="dlg-close">Đóng</button></div></dialog>

<footer>GIF nền trong suốt, được matte theo màu nền #F7FDFE của trang chủ — đặt trên nền tối sẽ thấy viền sáng.</footer>

<script>
const MASCOTS = [
  { id: "robot-cam", name: "Robot cam" },
  { id: "robot-xanh", name: "Robot xanh" },
  { id: "capybara", name: "Capybara" },
];
const ANIMS = [
  ["idle", "Idle", "clippy"], ["xin-chao", "Xin chào", "clippy"], ["suy-nghi", "Suy nghĩ", "clippy"],
  ["an-mung", "Ăn mừng", "clippy"], ["chu-y", "Chú ý!", "clippy"],
  ["ok-i-pull-up", "Ok I pull up", "trend"], ["aura-farming", "Aura farming", "trend"],
  ["mind-blown", "Mind blown", "trend"], ["rizz", "Rizz", "trend"],
  ["tang-bong", "Tâng bóng", "sport"], ["cau-long", "Cầu lông", "sport"], ["nang-ta", "Nâng tạ", "sport"],
  ["luot-song", "Lướt sóng", "sport"], ["truot-van", "Trượt ván", "sport"], ["tha-dieu", "Thả diều", "sport"],
];
const FILES = new Set(["capybara-an-mung.gif", "capybara-cau-long.gif", "capybara-chu-y.gif", "capybara-idle.gif", "capybara-mind-blown.gif", "capybara-nang-ta.gif", "capybara-ok-i-pull-up.gif", "capybara-rizz.gif", "capybara-suy-nghi.gif", "capybara-xin-chao.gif", "robot-cam-an-mung.gif", "robot-cam-chu-y.gif", "robot-cam-idle.gif", "robot-cam-mind-blown.gif", "robot-cam-rizz.gif", "robot-cam-suy-nghi.gif", "robot-cam-tang-bong.gif", "robot-cam-tha-dieu.gif", "robot-cam-xin-chao.gif", "robot-xanh-an-mung.gif", "robot-xanh-aura-farming.gif", "robot-xanh-chu-y.gif", "robot-xanh-idle.gif", "robot-xanh-luot-song.gif", "robot-xanh-mind-blown.gif", "robot-xanh-rizz.gif", "robot-xanh-suy-nghi.gif", "robot-xanh-truot-van.gif", "robot-xanh-xin-chao.gif"]);
const TAG = { clippy: ["Clippy", ""], trend: ["Gen Alpha", "trend"], sport: ["Thể thao", "sport"] };

const main = document.getElementById("main");
for (const m of MASCOTS) {
  const sec = document.createElement("section");
  sec.innerHTML = `<h2><img src="${m.id}.png" alt="">${m.name}</h2><div class="grid"></div>`;
  const grid = sec.querySelector(".grid");
  for (const [a, label, cat] of ANIMS) {
    const f = `gif/${m.id}-${a}.gif`;
    if (!FILES.has(`${m.id}-${a}.gif`)) continue;
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.cat = cat;
    card.innerHTML = `<div class="stage"><img src="${f}" loading="lazy" alt="${m.name} – ${label}"></div>
      <div class="meta"><b>${label}</b><span class="tag ${TAG[cat][1]}">${TAG[cat][0]}</span><a href="${f}" download>Tải</a></div>`;
    card.querySelector(".stage").onclick = () => {
      document.getElementById("dlg-img").src = f;
      document.getElementById("dlg-cap").textContent = `${m.name} · ${label}`;
      document.getElementById("dlg").showModal();
    };
    grid.appendChild(card);
  }
  main.appendChild(sec);
}

document.getElementById("dlg-close").onclick = () => document.getElementById("dlg").close();
document.getElementById("dlg").onclick = (e) => { if (e.target.id === "dlg") e.target.close(); };

document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => {
  document.querySelectorAll("[data-f]").forEach(x => x.setAttribute("aria-pressed", x === b));
  const f = b.dataset.f;
  document.querySelectorAll(".card").forEach(c => c.classList.toggle("hide", f !== "all" && c.dataset.cat !== f));
  document.querySelectorAll("section").forEach(s => s.classList.toggle("hide", !s.querySelector(".card:not(.hide)")));
});
document.querySelectorAll("[data-bg]").forEach(b => b.onclick = () => {
  document.querySelectorAll("[data-bg]").forEach(x => x.setAttribute("aria-pressed", x === b));
  document.documentElement.style.setProperty("--stage", b.dataset.bg);
});
</script>
</body>
</html>
